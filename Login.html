<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Sign in or create a MarkViz account to open the dashboard." />
	<title>MarkViz | Login</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
	<style>
		:root {
			--ink: #13172a;
			--muted: #69708a;
			--line: #e5e7f0;
			--primary: #5b5cf0;
			--primary-dark: #4546d7;
			--surface: #ffffff;
		}

		* { box-sizing: border-box; }
		html { scrollbar-width: none; }
		html::-webkit-scrollbar { display: none; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 16px;
			color: var(--ink);
			background: transparent;
			font-family: Manrope, sans-serif;
			overflow-y: auto;
			scrollbar-width: none;
		}
		body::-webkit-scrollbar { display: none; }

		.auth-dialog {
			width: min(100%, 390px);
			position: relative;
			padding: 25px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: var(--surface);
			box-shadow: 0 10px 28px rgba(31, 35, 72, .12);
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			color: var(--ink);
			text-decoration: none;
			font: 700 21px "Space Grotesk", sans-serif;
		}

		.logo {
			width: 36px;
			height: 36px;
			display: grid;
			place-items: center;
			border-radius: 9px;
			color: #fff;
			background: var(--primary);
		}

		h1 {
			margin: 20px 0 6px;
			font: 700 24px/1.15 "Space Grotesk", sans-serif;
		}

		.subtitle {
			margin: 0 0 17px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.6;
		}

		.mode-switch {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 4px;
			padding: 3px;
			margin-bottom: 17px;
			border: 1px solid var(--line);
			border-radius: 9px;
			background: #f8f9fc;
		}

		.mode-switch button {
			padding: 9px;
			border: 0;
			border-radius: 7px;
			color: var(--muted);
			background: transparent;
			font: 700 13px Manrope, sans-serif;
			cursor: pointer;
		}

		.mode-switch button.active {
			color: var(--primary);
			background: #fff;
			box-shadow: 0 1px 4px rgba(31, 35, 72, .1);
		}

		.field { display: block; margin-bottom: 11px; }
		.field label {
			display: block;
			margin-bottom: 7px;
			color: #424963;
			font-size: 12px;
			font-weight: 800;
		}

		.field input {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			color: var(--ink);
			background: #fff;
			font-size: 14px;
			outline: none;
			transition: border-color .2s, box-shadow .2s;
		}

		.field input:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 4px rgba(91, 92, 240, .12);
		}
		.password-control { position: relative; }
		.password-control input { padding-right: 76px; }
		.password-toggle {
			position: absolute;
			right: 8px;
			top: 50%;
			transform: translateY(-50%);
			padding: 4px 6px;
			border: 0;
			border-radius: 5px;
			color: var(--primary);
			background: transparent;
			font-size: 11px;
			font-weight: 800;
			cursor: pointer;
		}
		.password-toggle:hover { background: #f2f2ff; }

		.signup-only[hidden] { display: none; }
		.captcha-row {
			display: grid;
			grid-template-columns: 1fr 1fr auto;
			gap: 8px;
			align-items: end;
		}
		.captcha-code {
			padding: 11px 8px;
			border: 1px dashed #aeb2ed;
			border-radius: 8px;
			color: var(--primary-dark);
			background: #f2f2ff;
			font: 800 17px "Space Grotesk", sans-serif;
			letter-spacing: .14em;
			text-align: center;
			user-select: none;
		}
		.refresh-captcha {
			width: 41px;
			height: 41px;
			border: 1px solid var(--line);
			border-radius: 8px;
			color: var(--primary);
			background: #fff;
			font-size: 20px;
			cursor: pointer;
		}
		.refresh-captcha:hover { background: #f5f5ff; }

		.submit {
			width: 100%;
			margin-top: 4px;
			padding: 12px;
			border: 0;
			border-radius: 8px;
			color: #fff;
			background: var(--primary);
			font: 800 14px Manrope, sans-serif;
			cursor: pointer;
			transition: transform .2s, background .2s;
		}

		.submit:hover { background: var(--primary-dark); }
		.message { min-height: 20px; margin: 12px 0 0; color: #c2415c; font-size: 12px; text-align: center; }
		.message.success { color: #16835f; }
		.recovery-link { display: block; margin: -2px 0 12px; color: var(--primary); font-size: 12px; font-weight: 700; text-align: right; text-decoration: none; cursor: pointer; }
		.recovery-link:hover { color: var(--primary-dark); }
		.recovery-note { margin: -4px 0 16px; color: var(--muted); font-size: 12px; line-height: 1.55; }
		.recovery-fields[hidden] { display: none; }
		.back-link { display: block; margin-top: 19px; color: var(--muted); font-size: 12px; text-align: center; text-decoration: none; }
		.back-link:hover { color: var(--primary); }

		@media (max-width: 520px) { .auth-dialog { padding: 22px 18px; } h1 { font-size: 23px; } }
	</style>
</head>

<body>
	<main class="auth-dialog" role="dialog" aria-labelledby="authTitle" aria-modal="true">
		<a class="brand" href="markviz_landing_page.html"><span class="logo">M</span> MarkViz</a>
		<h1 id="authTitle">Welcome back</h1>
		<p class="subtitle" id="authSubtitle">Sign in to continue to your academic workspace.</p>

		<div class="mode-switch" role="tablist" aria-label="Account access">
			<button class="active" id="loginTab" type="button" role="tab" aria-selected="true">Log in</button>
			<button id="signupTab" type="button" role="tab" aria-selected="false">Sign up</button>
		</div>

		<form id="authForm" novalidate>
			<label class="field signup-only" hidden>
				<span>Full name</span>
				<input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Your full name" />
			</label>
			<label class="field signup-only" hidden>
				<span>Teaching school name</span>
				<input id="schoolName" name="schoolName" type="text" autocomplete="organization" placeholder="Your school's name" />
			</label>
			<label class="field signup-only" hidden>
				<span>School address</span>
				<input id="schoolAddress" name="schoolAddress" type="text" autocomplete="street-address" placeholder="School address" />
			</label>
			<label class="field signup-only" hidden>
				<span>Username</span>
				<input id="username" name="username" type="text" autocomplete="username" placeholder="Choose a username" minlength="1" />
			</label>
			<label class="field signup-only" hidden>
				<span>Phone number</span>
				<input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Your phone number" minlength="7" />
			</label>
			<label class="field">
				<span>Email address</span>
				<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
			</label>
			<label class="field">
				<span>Password</span>
				<div class="password-control">
					<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" minlength="6" required />
					<button class="password-toggle" type="button" data-password-target="password" aria-label="Show password">Show</button>
				</div>
			</label>
			<a class="recovery-link" id="forgotPassword" href="#">Forgot password?</a>
			<label class="field signup-only" id="confirmField" hidden>
				<span>Confirm password</span>
				<div class="password-control">
					<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" />
					<button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="Show confirm password">Show</button>
				</div>
			</label>
			<div class="field signup-only" id="captchaField" hidden>
				<span>Captcha</span>
				<div class="captcha-row">
					<strong class="captcha-code" id="captchaCode" aria-label="Generated captcha"></strong>
					<input id="captchaInput" name="captchaInput" type="text" autocomplete="off" placeholder="Enter code" />
					<button class="refresh-captcha" id="refreshCaptcha" type="button" aria-label="Generate a new captcha" title="Generate a new captcha">↻</button>
				</div>
			</div>
			<button class="submit" id="submitButton" type="submit">Log in to MarkViz</button>
			<p class="message" id="message" role="alert" aria-live="polite"></p>
		</form>
		<form id="recoveryForm" novalidate hidden>
			<p class="recovery-note" id="recoveryNote">Enter the username and phone number used during signup to verify your account.</p>
			<div id="identityFields" class="recovery-fields">
			<label class="field">
				<span>Username</span>
				<input id="recoveryUsername" type="text" autocomplete="username" placeholder="Your username" required />
			</label>
			<label class="field">
				<span>Phone number</span>
				<input id="recoveryPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Your signup phone number" required />
			</label>
			</div>
			<div id="newPasswordFields" class="recovery-fields" hidden>
				<label class="field">
					<span>New password</span>
					<div class="password-control">
						<input id="newPassword" type="password" autocomplete="new-password" placeholder="Create a new password" minlength="6" />
						<button class="password-toggle" type="button" data-password-target="newPassword" aria-label="Show new password">Show</button>
					</div>
				</label>
				<label class="field">
					<span>Confirm new password</span>
					<div class="password-control">
						<input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="Repeat your new password" minlength="6" />
						<button class="password-toggle" type="button" data-password-target="newPasswordConfirm" aria-label="Show confirm new password">Show</button>
					</div>
				</label>
			</div>
			<button class="submit" id="recoveryButton" type="submit">Verify details</button>
			<button class="submit" id="savePasswordButton" type="button" hidden>Save new password</button>
			<p class="message" id="recoveryMessage" role="alert" aria-live="polite"></p>
			<a class="back-link" id="backToLogin" href="#">Back to login</a>
		</form>
		<a class="back-link" id="closeAuth" href="markviz_landing_page.html">Close</a>
	</main>

	<script>
		const loginTab = document.getElementById("loginTab");
		const signupTab = document.getElementById("signupTab");
		const confirmField = document.getElementById("confirmField");
		const confirmPassword = document.getElementById("confirmPassword");
		const signupFields = document.querySelectorAll(".signup-only");
		const fullName = document.getElementById("fullName");
		const schoolName = document.getElementById("schoolName");
		const schoolAddress = document.getElementById("schoolAddress");
		const username = document.getElementById("username");
		const phone = document.getElementById("phone");
		const captchaCode = document.getElementById("captchaCode");
		const captchaInput = document.getElementById("captchaInput");
		const refreshCaptcha = document.getElementById("refreshCaptcha");
		const email = document.getElementById("email");
		const password = document.getElementById("password");
		const authTitle = document.getElementById("authTitle");
		const authSubtitle = document.getElementById("authSubtitle");
		const submitButton = document.getElementById("submitButton");
		const form = document.getElementById("authForm");
		const message = document.getElementById("message");
		const closeAuth = document.getElementById("closeAuth");
		const forgotPassword = document.getElementById("forgotPassword");
		const recoveryForm = document.getElementById("recoveryForm");
		const recoveryUsername = document.getElementById("recoveryUsername");
		const recoveryPhone = document.getElementById("recoveryPhone");
		const recoveryNote = document.getElementById("recoveryNote");
		const identityFields = document.getElementById("identityFields");
		const newPasswordFields = document.getElementById("newPasswordFields");
		const newPassword = document.getElementById("newPassword");
		const newPasswordConfirm = document.getElementById("newPasswordConfirm");
		const recoveryButton = document.getElementById("recoveryButton");
		const savePasswordButton = document.getElementById("savePasswordButton");
		const recoveryMessage = document.getElementById("recoveryMessage");
		const backToLogin = document.getElementById("backToLogin");
		let signupMode = false;
		let generatedCaptcha = "";
		let resetToken = "";

		document.querySelectorAll(".password-toggle").forEach((toggle) => {
			toggle.addEventListener("click", () => {
				const input = document.getElementById(toggle.dataset.passwordTarget);
				const isVisible = input.type === "text";
				input.type = isVisible ? "password" : "text";
				toggle.textContent = isVisible ? "Show" : "Hide";
				toggle.setAttribute("aria-label", `${isVisible ? "Show" : "Hide"} ${input.getAttribute("aria-label") || input.id.replace(/([A-Z])/g, " $1").toLowerCase()}`);
			});
		});

		function setMessage(element, text, success = false) {
			element.textContent = text;
			element.classList.toggle("success", success);
		}

		function showRecovery(show) {
			form.hidden = show;
			recoveryForm.hidden = !show;
			forgotPassword.hidden = show;
			if (show) {
				authTitle.textContent = "Recover your password";
				authSubtitle.textContent = "Verify your signup details to regain access.";
				setMessage(recoveryMessage, "");
				recoveryNote.textContent = "Enter the username and phone number used during signup to verify your account.";
				identityFields.hidden = false;
				newPasswordFields.hidden = true;
				recoveryUsername.required = true;
				recoveryPhone.required = true;
				newPassword.required = false;
				newPasswordConfirm.required = false;
				recoveryButton.textContent = "Verify details";
				recoveryButton.hidden = false;
				savePasswordButton.hidden = true;
				resetToken = "";
				recoveryUsername.focus();
			} else {
				setMode(false);
				email.focus();
			}
		}

		closeAuth.addEventListener("click", (event) => {
			if (window.parent !== window) {
				event.preventDefault();
				window.parent.postMessage("closeMarkVizAuth", "*");
			}
		});

		function generateCaptcha() {
			const characters = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
			generatedCaptcha = Array.from({ length: 6 }, () => characters[Math.floor(Math.random() * characters.length)]).join("");
			captchaCode.textContent = generatedCaptcha;
			captchaInput.value = "";
		}

		function setMode(isSignup) {
			signupMode = isSignup;
			loginTab.classList.toggle("active", !isSignup);
			signupTab.classList.toggle("active", isSignup);
			loginTab.setAttribute("aria-selected", String(!isSignup));
			signupTab.setAttribute("aria-selected", String(isSignup));
			confirmField.hidden = !isSignup;
			confirmPassword.required = isSignup;
			if (!isSignup) confirmPassword.value = "";
			signupFields.forEach((field) => {
				field.hidden = !isSignup;
				field.querySelector("input")?.toggleAttribute("required", isSignup);
			});
			forgotPassword.hidden = isSignup;
			if (isSignup) generateCaptcha();
			authTitle.textContent = isSignup ? "Create your workspace" : "Welcome back";
			authSubtitle.textContent = isSignup ? "Create an account to start using your academic workspace." : "Sign in to continue to your academic workspace.";
			submitButton.textContent = isSignup ? "Create account" : "Log in to MarkViz";
			setMessage(message, "");
		}

		loginTab.addEventListener("click", () => setMode(false));
		signupTab.addEventListener("click", () => setMode(true));
		forgotPassword.addEventListener("click", (event) => { event.preventDefault(); showRecovery(true); });
		backToLogin.addEventListener("click", (event) => { event.preventDefault(); showRecovery(false); });
		refreshCaptcha.addEventListener("click", generateCaptcha);

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			setMessage(message, "");
			if (!form.checkValidity()) {
				setMessage(message, "Please enter a valid email and a password of at least 6 characters.");
				form.reportValidity();
				return;
			}
			if (signupMode && password.value !== confirmPassword.value) {
				setMessage(message, "Passwords do not match.");
				confirmPassword.focus();
				return;
			}
			if (signupMode && captchaInput.value.trim().toLowerCase() !== generatedCaptcha.toLowerCase()) {
				setMessage(message, "The captcha does not match. Please try again.");
				captchaInput.focus();
				generateCaptcha();
				return;
			}
			submitButton.disabled = true;
			submitButton.textContent = signupMode ? "Creating account..." : "Signing in...";
			try {
				const response = await fetch(signupMode ? "/api/auth/signup" : "/api/auth/login", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					credentials: "same-origin",
					body: JSON.stringify(signupMode ? {
						fullName: fullName.value,
						schoolName: schoolName.value,
						schoolAddress: schoolAddress.value,
						username: username.value,
						phone: phone.value,
						email: email.value,
						password: password.value,
					} : { email: email.value, password: password.value }),
				});
				const result = await response.json();
				if (!response.ok) throw new Error(result.error || "Authentication failed.");
				if (signupMode) {
					setMode(false);
					password.value = "";
					setMessage(message, "Account created. Please log in to open your dashboard.", true);
					return;
				}
				if (window.parent !== window) {
					window.parent.postMessage("markvizAuthSuccess", window.location.origin);
				} else {
					window.location.href = "markviz.html";
				}
			} catch (error) {
				setMessage(message, error.message || "Unable to contact the MarkViz server.");
			} finally {
				submitButton.disabled = false;
				submitButton.textContent = signupMode ? "Create account" : "Log in to MarkViz";
			}
		});

		recoveryForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			setMessage(recoveryMessage, "");
			if (!recoveryForm.checkValidity()) { recoveryForm.reportValidity(); return; }
			if (resetToken && newPassword.value !== newPasswordConfirm.value) {
				setMessage(recoveryMessage, "New passwords do not match.");
				newPasswordConfirm.focus();
				return;
			}
			if (resetToken) {
				recoveryButton.disabled = true;
				savePasswordButton.disabled = true;
				savePasswordButton.textContent = "Saving password...";
			} else {
				recoveryButton.disabled = true;
				recoveryButton.textContent = "Verifying...";
			}
			try {
				const response = await fetch(resetToken ? "/api/auth/reset-password" : "/api/auth/forgot-password", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					credentials: "same-origin",
					body: JSON.stringify(resetToken
						? { resetToken, newPassword: newPassword.value }
						: { username: recoveryUsername.value, phone: recoveryPhone.value }),
				});
				const result = await response.json();
				if (!response.ok) throw new Error(result.error || "Unable to recover the password.");
				if (!resetToken) {
					resetToken = result.resetToken;
					recoveryNote.textContent = "Identity verified. Create a new password for your account.";
					identityFields.hidden = true;
					newPasswordFields.hidden = false;
					recoveryUsername.required = false;
					recoveryPhone.required = false;
					newPassword.required = true;
					newPasswordConfirm.required = true;
					recoveryButton.hidden = true;
					recoveryButton.disabled = false;
					savePasswordButton.hidden = false;
					savePasswordButton.disabled = false;
					newPassword.focus();
				} else {
					recoveryUsername.value = "";
					recoveryPhone.value = "";
					newPassword.value = "";
					newPasswordConfirm.value = "";
					resetToken = "";
					showRecovery(false);
					setMessage(message, "Password changed successfully. Please log in with your new password.", true);
					email.focus();
				}
			} catch (error) {
				setMessage(recoveryMessage, error.message || "Unable to contact the MarkViz server.");
			} finally {
				recoveryButton.disabled = false;
				savePasswordButton.disabled = false;
				recoveryButton.textContent = "Verify details";
				savePasswordButton.textContent = "Save new password";
			}
		});

		async function saveNewPassword() {
			setMessage(recoveryMessage, "");
			if (!recoveryForm.checkValidity()) {
				recoveryForm.reportValidity();
				return;
			}
			if (newPassword.value !== newPasswordConfirm.value) {
				setMessage(recoveryMessage, "New passwords do not match.");
				newPasswordConfirm.focus();
				return;
			}
			savePasswordButton.disabled = true;
			savePasswordButton.textContent = "Saving password...";
			try {
				const response = await fetch("/api/auth/reset-password", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					credentials: "same-origin",
					body: JSON.stringify({ resetToken, newPassword: newPassword.value }),
				});
				const result = await response.json();
				if (!response.ok) throw new Error(result.error || "Unable to save the new password.");
				resetToken = "";
				showRecovery(false);
				setMessage(message, "Password changed successfully. Please log in with your new password.", true);
				email.focus();
			} catch (error) {
				setMessage(recoveryMessage, error.message || "Unable to contact the MarkViz server.");
			} finally {
				savePasswordButton.disabled = false;
				savePasswordButton.textContent = "Save new password";
			}
		}

		savePasswordButton.addEventListener("click", saveNewPassword);
	</script>
</body>
</html>
